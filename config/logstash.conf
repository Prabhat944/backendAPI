# logstash.conf

# 1. Input Section: Where Logstash receives data from
input {
  udp {
    port => 5000
    codec => "json_lines" # This tells Logstash to expect one JSON object per line
  }
}

# 2. Output Section: Where Logstash sends the data to
output {
  elasticsearch {
    hosts => ["http://your-elasticsearch-server-ip:9200"] # The address of your Elasticsearch server
    index => "fantasy-app-logs-%{+YYYY.MM.dd}"     # Organizes logs into daily indexes
  }
}